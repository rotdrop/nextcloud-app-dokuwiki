# SPDX-License-Identifier: AGPL-3.0-or-later
# Reusable workflow building the ready-to-use app archive (the same
# artifact as `make appstore`) and uploading it as a workflow artifact.
# It serves both as the build stage of the release workflow and as a
# check on pull requests, so the two can never drift apart.
name: Build app archive

on:
  workflow_call:
    inputs:
      release:
        description: Require signing in the protected release environment
        type: boolean
        default: false
    # Signing secrets come from the `release` environment; the release
    # caller must use `secrets: inherit` to make them visible here.
    outputs:
      version:
        description: The app version read from appinfo/info.xml
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Name of the uploaded tarball artifact
        value: dokuwiki-${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.release && 'release' || '' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/apps/dokuwiki
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Use HTTPS for submodules
        working-directory: .
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # PHP-to-TypeScript generation requires an installed Nextcloud server.
      - name: Checkout Nextcloud
        uses: actions/checkout@v5
        with:
          repository: rotdrop/nextcloud-server
          ref: cjh-stable35
          submodules: recursive
          path: server
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: server/apps/dokuwiki
          submodules: recursive
          persist-credentials: false

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml-xpath-perl rsync

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick
          tools: composer:v2
          coverage: none
          ini-values: apc.enable_cli=1, memory_limit=1G

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Nextcloud
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php occ maintenance:install --database=sqlite \
            --admin-user=admin --admin-pass=admin --no-interaction

      - name: Read app version
        id: meta
        run: |
          version=$(php -r 'echo (string)simplexml_load_file("appinfo/info.xml")->version;')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build app archive
        run: make appstore APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Check generated TypeScript modules
        run: >-
          node_modules/.bin/tsc --ignoreConfig --noEmit
          --allowImportingTsExtensions --target es2022 --module nodenext
          $(find build/ts-types/php-modules -name '*.ts')

      - name: Sanity-check the build
        run: |
          count=$(tar tzf build/artifacts/appstore/dokuwiki-${{ steps.meta.outputs.version }}.tar.gz | grep -Ec 'dokuwiki/js/.*\.m?js$' || true)
          echo "JS bundles in archive: $count"
          test "$count" -gt 0 || { echo "::error::No JS bundles in the archive"; exit 1; }
          for entry in admin-settings app refresh; do
            tar tzf build/artifacts/appstore/dokuwiki-${{ steps.meta.outputs.version }}.tar.gz \
              | grep -E "^dokuwiki/js/(dokuwiki-)?$entry-[^/]+\.m?js$" \
              || { echo "::error::Missing $entry entry bundle"; exit 1; }
          done

      - name: Sign and verify release archive
        if: inputs.release
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$APP_PRIVATE_KEY" || { echo "::error::APP_PRIVATE_KEY is missing"; exit 1; }
          test -n "$APP_PUBLIC_CRT" || { echo "::error::APP_PUBLIC_CRT is missing"; exit 1; }
          signing_dir=$(mktemp -d "$RUNNER_TEMP/dokuwiki-signing.XXXXXX")
          trap 'rm -f "$signing_dir/dokuwiki.key" "$signing_dir/dokuwiki.crt" "$signing_dir/public.pem"; rmdir "$signing_dir"' EXIT
          umask 077
          printf '%s\n' "$APP_PRIVATE_KEY" > "$signing_dir/dokuwiki.key"
          printf '%s\n' "$APP_PUBLIC_CRT" > "$signing_dir/dokuwiki.crt"
          unset APP_PRIVATE_KEY APP_PUBLIC_CRT
          openssl x509 -in "$signing_dir/dokuwiki.crt" -checkend 0 -noout
          openssl x509 -in "$signing_dir/dokuwiki.crt" -pubkey -noout > "$signing_dir/public.pem"
          php ../../occ integrity:sign-app \
            --privateKey="$signing_dir/dokuwiki.key" \
            --certificate="$signing_dir/dokuwiki.crt" \
            --path="$PWD/build/artifacts/appstore/sign/dokuwiki"
          test -s build/artifacts/appstore/sign/dokuwiki/appinfo/signature.json
          php ../../occ integrity:check-app --path="$PWD/build/artifacts/appstore/sign/dokuwiki" dokuwiki
          archive="build/artifacts/appstore/dokuwiki-$VERSION.tar.gz"
          tar -czf "$archive" -C build/artifacts/appstore/sign dokuwiki
          openssl dgst -sha512 -sign "$signing_dir/dokuwiki.key" -out "$archive.sig" "$archive"
          openssl dgst -sha512 -verify "$signing_dir/public.pem" -signature "$archive.sig" "$archive"

      - name: Name the artifact after the version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cp "build/artifacts/appstore/dokuwiki-$VERSION.tar.gz" .
          if [ -f "build/artifacts/appstore/dokuwiki-$VERSION.tar.gz.sig" ]; then
            cp "build/artifacts/appstore/dokuwiki-$VERSION.tar.gz.sig" .
          fi
          sha256sum "dokuwiki-$VERSION.tar.gz" > "dokuwiki-$VERSION.tar.gz.sha256"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: dokuwiki-${{ steps.meta.outputs.version }}
          path: |
            server/apps/dokuwiki/dokuwiki-${{ steps.meta.outputs.version }}.tar.gz
            server/apps/dokuwiki/dokuwiki-${{ steps.meta.outputs.version }}.tar.gz.sig
            server/apps/dokuwiki/dokuwiki-${{ steps.meta.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
