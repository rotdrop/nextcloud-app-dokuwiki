# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Basic checks on pull requests and pushes to master: eslint over the
# frontend sources, php -l over the PHP sources for every supported PHP
# version, and a full production build of the app archive via the
# reusable build-appstore.yml workflow (the same build the release
# workflow ships, so regressions in it surface before tagging).
name: CI

on:
  pull_request: {}
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check release metadata
        run: python3 .github/scripts/validate-release.py

      - name: Test release validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        # package-lock.json is not tracked, so `npm ci` is not available.
        run: npm install

      - name: Run eslint
        run: npm run lint

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.4', '8.5']
    name: php-lint (${{ matrix.php-versions }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Lint PHP files
        run: find lib appinfo templates composer -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  build:
    needs: release-metadata
    uses: ./.github/workflows/build-appstore.yml

  realclean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/apps/dokuwiki
    steps:
      - name: Use HTTPS for submodules
        working-directory: .
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout Nextcloud
        uses: actions/checkout@v5
        with:
          repository: rotdrop/nextcloud-server
          ref: cjh-stable35
          submodules: recursive
          path: server
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: server/apps/dokuwiki
          submodules: recursive
          persist-credentials: false

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml-xpath-perl rsync

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick
          tools: composer:v2
          coverage: none
          ini-values: apc.enable_cli=1, memory_limit=1G

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Realclean on a bare checkout
        run: |
          make realclean
          test -z "$(git status --porcelain --ignored)" || { git status --porcelain --ignored; exit 1; }

      - name: Realclean is idempotent on a bare checkout
        run: |
          make realclean
          test -z "$(git status --porcelain --ignored)" || { git status --porcelain --ignored; exit 1; }

      - name: Install Nextcloud
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php occ maintenance:install --database=sqlite \
            --admin-user=admin --admin-pass=admin --no-interaction

      - name: Full build
        run: make appstore APP_VERSION=$(php -r 'echo (string)simplexml_load_file("appinfo/info.xml")->version;')

      - name: Realclean after a full build
        run: |
          make realclean
          test -z "$(git status --porcelain --ignored)" || { git status --porcelain --ignored; exit 1; }

      - name: Realclean is idempotent after a full build
        run: |
          make realclean
          test -z "$(git status --porcelain --ignored)" || { git status --porcelain --ignored; exit 1; }
