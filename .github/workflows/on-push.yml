# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Basic checks on pull requests and pushes to master via the shared CI
# workflow of the build system (eslint, php -l, realclean check and a
# full build of the app archive), plus the app-specific release metadata
# validation.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check release metadata
        run: python3 .github/scripts/validate-release.py

      - name: Test release validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  ci:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/ci.yml@v1
    with:
      php-version: '8.5'
      php-versions: '["8.4", "8.5"]'
      php-lint-dirs: lib appinfo templates composer
      verify-script: .github/scripts/verify-build.sh
