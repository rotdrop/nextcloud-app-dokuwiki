#
# Tag-triggered release via the shared release workflow of the build
# system. The tag must match the version in appinfo/info.xml; the
# CHANGELOG.md/info.xml consistency is checked before tagging by
# `make release`.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/release.yml@main
    # APP_PRIVATE_KEY, APP_PUBLIC_CRT and APPSTORE_TOKEN
    secrets: inherit
    permissions:
      contents: write
    with:
      php-version: '8.5'
      verify-script: .github/scripts/verify-build.sh
      publish-to-appstore: true
